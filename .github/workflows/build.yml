name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            flags: ''
            integrations: false
          - name: integrations
            flags: '-PwithIntegrations'
            integrations: true
          - name: integrations-lithium
            flags: '-PwithIntegrations -PwithLithium'
            integrations: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch verified optional test mods
        if: matrix.integrations
        run: python3 scripts/fetch-test-mods.py
      - name: Build, unit tests, dedicated-server tests
        run: ./gradlew clean build ${{ matrix.flags }} --no-daemon
      - name: Production jar startup and restart smoke
        if: matrix.name == 'baseline'
        run: |
          curl --fail --location --retry 3 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.165.0%2B26.3/fabric-api-0.165.0%2B26.3.jar' -o /tmp/namelink-fabric-api.jar
          python3 scripts/production-smoke.py --fabric-api /tmp/namelink-fabric-api.jar --accept-eula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namelink-${{ matrix.name }}
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/
          if-no-files-found: warn
